<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Ceyda ❤️ Yasin ✨</title>
  <!-- Google Fonts: Cormorant Garamond, Montserrat, Great Vibes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Arka Plan Animasyonlu Mesh Gradient Katmanı -->
  <div class="gradient-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="gradient-noise"></div>
  </div>

  <!-- Parçacıklar (Yıldızlar, Kalpler, Çilekler, Işıltılar) Canvas Katmanı -->
  <canvas id="dream-canvas"></canvas>

  <!-- Zarif Merkez İsimler -->
  <main class="hero-container">
    <div class="center-content">
      <h1 class="romantic-title">
        <span class="name-text">Ceyda</span>
        <span class="heart-pulse">❤️</span>
        <span class="name-text">Yasin</span>
      </h1>
    </div>
  </main>

  <!-- Mobil Uyumlu Minimalist Müzik Butonu -->
  <button id="music-btn" class="music-pill" aria-label="Müziği Başlat / Durdur">
    <span class="music-icon">🎵</span>
    <span class="music-text">Melodi</span>
  </button>

  <audio id="bg-audio" loop playsinline webkit-playsinline></audio>

  <script src="script.js"></script>
</body>
</html>
